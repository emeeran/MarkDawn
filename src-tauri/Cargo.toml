[package]
name = "markdawn"
version = "0.1.1"
description = "MarkDawn — a Typora-style Markdown editor with AI integration"
edition = "2021"
rust-version = "1.77"

[lib]
name = "markdawn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
notify = "8"
trash = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
